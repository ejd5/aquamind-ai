name: ARQWELIA E2E

on:
  pull_request:
    branches:
      - main
    paths:
      - 'src/app/(public)/arqwelia/**'
      - 'src/app/pro/arqwelia/**'
      - 'src/app/api/arqwelia/**'
      - 'src/components/arqwelia/**'
      - 'src/lib/arqwelia/**'
      - 'tests/e2e/**'
      - 'playwright.config.ts'
      - 'prisma/schema.prisma'
      - '.github/workflows/arqwelia-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: ARQWELIA Lot 1 (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      NEXTAUTH_URL: http://localhost:3098
      NEXTAUTH_SECRET: e2e-secret-only
      NEXT_PUBLIC_ARQWELIA_LOT1_ENABLED: 'true'
      NEXT_PUBLIC_ARQWELIA_DEMO_MODE: 'true'
      DEMO_ACCOUNT_ENABLED: 'true'
      DEMO_ACCOUNT_EMAIL: 'demo@e2e.dev'
      DEMO_ACCOUNT_PASSWORD: 'demo-e2e-password-2026!'
      AUTH_TRUST_HOST: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma clients
        run: bunx prisma generate && bunx prisma generate --schema prisma/postgresql/schema.prisma

      - name: Install Playwright browsers (Chromium)
        run: bunx playwright install --with-deps chromium

      - name: Run Playwright E2E (flag ON)
        run: bunx playwright test --config playwright.config.ts

      - name: Run Playwright E2E (flag OFF — teaser gate)
        run: bunx playwright test --config playwright.off.config.ts

      - name: Upload Playwright report (on failure)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7