name: P1 Scientific Quality

on:
  pull_request:
    branches:
      - main
      - feat/p1-mobile-technician-journey
      - feat/p1-scientific-quality
      - feat/p1-scientific-contextual-targets
    paths:
      - '.github/workflows/p1-scientific-quality.yml'
      - 'docs/release/P1_SCIENTIFIC_*.md'
      - 'src/app/api/pool/water-test/route.ts'
      - 'src/lib/pool/**'
      - 'tests/p1-scientific-*.test.ts'

permissions:
  contents: read

concurrency:
  group: p1-scientific-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scientific-quality:
    name: Validate scientific contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      DATABASE_URL: file:/tmp/aqwelia-scientific-ci.db
      NEXTAUTH_SECRET: test-secret-for-scientific-ci-only
      NEXTAUTH_URL: http://localhost:3099
      AUTH_TRUST_HOST: 'true'
      STRIPE_SECRET_KEY: sk_test_scientific_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_scientific_ci_placeholder
      REVENUECAT_WEBHOOK_SECRET: rc_wh_scientific_ci_only

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma clients
        run: bun run db:generate:all

      - name: Validate PostgreSQL schema and baseline
        run: bun run test:postgresql

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Run scientific contracts
        run: bunx vitest run tests/p1-scientific-*.test.ts

      - name: Run complete smoke suite
        shell: bash
        run: |
          set -o pipefail
          bash tests/run-smoke-tests.sh 2>&1 | tee /tmp/aqwelia-scientific-smoke.log

      - name: Upload failed smoke log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p1-scientific-smoke-log
          path: /tmp/aqwelia-scientific-smoke.log
          if-no-files-found: warn
          retention-days: 7

      - name: Build production application
        run: bun run build
