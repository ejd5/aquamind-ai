name: P1 Product Quality

on:
  pull_request:
    branches:
      - main
      - feat/p1-mobile-technician-journey
      - feat/p1-scientific-quality
      - feat/p1-scientific-contextual-targets
      - feat/p1-scientific-safety-readiness
      - feat/p1-scientific-persistence
      - feat/p1-scientific-confidence-provenance
      - feat/p1-commercial-pro
    paths:
      - '.github/workflows/p1-scientific-quality.yml'
      - 'docs/release/P1_SCIENTIFIC_*.md'
      - 'docs/release/P1_COMMERCIAL_*.md'
      - 'docs/release/P1_PRO_GEOLOCATION_*.md'
      - 'prisma/**'
      - 'src/app/api/pool/profile/route.ts'
      - 'src/app/api/pool/water-test/route.ts'
      - 'src/app/api/pro/commercial/**'
      - 'src/app/api/pro/maps/**'
      - 'src/lib/pool/**'
      - 'src/lib/pro/commercial.ts'
      - 'src/lib/pro/google-maps.ts'
      - 'tests/check-postgresql-schema.sh'
      - 'tests/check-scientific-sqlite-migration.py'
      - 'tests/p1-scientific-*.test.ts'
      - 'tests/p1-commercial-pro.test.ts'
      - 'tests/p1-pro-geolocation-maps.test.ts'

permissions:
  contents: read

concurrency:
  group: p1-product-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  product-quality:
    name: Validate P1 product contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      DATABASE_URL: file:/tmp/aqwelia-p1-ci.db
      NEXTAUTH_SECRET: test-secret-for-p1-ci-only
      NEXTAUTH_URL: http://localhost:3099
      AUTH_TRUST_HOST: 'true'
      STRIPE_SECRET_KEY: sk_test_p1_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_p1_ci_placeholder
      REVENUECAT_WEBHOOK_SECRET: rc_wh_p1_ci_only
      GOOGLE_MAPS_SERVER_API_KEY: ''

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma clients
        run: bun run db:generate:all

      - name: Validate PostgreSQL schema and migration structure
        run: bun run test:postgresql

      - name: Execute SQLite scientific migration
        run: python3 tests/check-scientific-sqlite-migration.py

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Run P1 contracts
        shell: bash
        run: |
          set -o pipefail
          bunx vitest run tests/p1-scientific-*.test.ts tests/p1-commercial-pro.test.ts tests/p1-pro-geolocation-maps.test.ts 2>&1 | tee /tmp/aqwelia-p1-contracts.log

      - name: Upload failed P1 contract log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p1-contract-log
          path: /tmp/aqwelia-p1-contracts.log
          if-no-files-found: warn
          retention-days: 7

      - name: Run complete smoke suite
        shell: bash
        run: |
          set -o pipefail
          bash tests/run-smoke-tests.sh 2>&1 | tee /tmp/aqwelia-p1-smoke.log

      - name: Upload failed smoke log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p1-smoke-log
          path: /tmp/aqwelia-p1-smoke.log
          if-no-files-found: warn
          retention-days: 7

      - name: Build production application
        run: bun run build
