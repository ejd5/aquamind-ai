name: Apply P0-L2 compliance bundle

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: p0-l2-compliance-bundle
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'fix/p0-l2-legal-privacy-compliance'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/p0-l2-legal-privacy-compliance
          fetch-depth: 1

      - name: Rebuild and verify bundle
        id: rebuild
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d .p0l2-bundle ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Bundle already applied.'
            exit 0
          fi
          find .p0l2-bundle -type f -name 'part-*' -print0 | sort -z | xargs -0 cat > /tmp/p0l2.b64
          base64 --decode /tmp/p0l2.b64 > /tmp/p0l2.tar.zst
          echo '0a240b70947b6daa3427aa235bf39473fbdaa62f9e98845556ea74a66a77f765  /tmp/p0l2.tar.zst' | sha256sum --check --strict
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          tar --use-compress-program=unzstd -xf /tmp/p0l2.tar.zst
          rm -rf .p0l2-bundle
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Commit compliance implementation
        if: steps.rebuild.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(p0-l2): legal privacy and launch compliance'
          git push origin HEAD:fix/p0-l2-legal-privacy-compliance
