name: PR104 Apply

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/pr104-weather-sidebar' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pr104-weather-sidebar
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - shell: python
        run: |
          from pathlib import Path
          p=Path('src/components/aquamind/module-weather.tsx'); s=p.read_text()
          s=s.replace("  Loader2,\n} from 'lucide-react'", "  Loader2,\n  Crown,\n} from 'lucide-react'", 1)
          s=s.replace("  assessment: Assessment\n  lastTestDaysAgo: number\n  error?: string\n", "  assessment: Assessment | null\n  lastTestDaysAgo: number\n  upgradeRequired?: boolean\n  error?: string\n", 1)
          s=s.replace("  const t = useTranslations('weather')\n  const locale = useLocale()\n", "  const t = useTranslations('weather')\n  const tNav = useTranslations('nav')\n  const locale = useLocale()\n", 1)
          old="""  const { weather, assessment } = data
  const topAlert = assessment.alerts[0]
  const algae = ALGAE_CFG[assessment.algaeRisk]
  const swim = SWIM_CFG[assessment.swimComfort]

  return (
"""
          new="""  const { weather, assessment } = data

  // The API intentionally returns assessment=null when weather_advanced is gated.
  // Keep basic weather usable instead of crashing the whole client application.
  if (!assessment) {
    return (
      <div className=\"space-y-5\">
        <Header
          t={t}
          right={
            <Button variant=\"outline\" size=\"sm\" onClick={() => load()} className=\"border-border/60\" disabled={loading || locating}>
              <RefreshCw className=\"h-3.5 w-3.5\" />
              {t('refresh')}
            </Button>
          }
        />
        <Card className=\"glass-card\">
          <CardHeader className=\"pb-2\">
            <CardDescription>{t('currentConditions')}</CardDescription>
            <CardTitle className=\"flex items-center justify-between font-display text-base\">
              <span>{t('nowAt', { location: weather.location })}</span>
              {codeToIcon(weather.weatherCode)}
            </CardTitle>
          </CardHeader>
          <CardContent>
            <div className=\"flex flex-wrap items-end gap-6\">
              <div>
                <p className=\"font-display text-5xl font-bold text-primary\">{weather.currentTempC}°C</p>
                <p className=\"text-xs text-muted-foreground\">{t('feelsLike')} {weather.feelsLikeC}°C · {t(`codes.${weather.weatherCode}`)}</p>
              </div>
              <div className=\"grid grid-cols-2 gap-x-6 gap-y-2 sm:grid-cols-3\">
                <Metric icon={<Droplets className=\"h-3.5 w-3.5 text-primary\" />} label={t('humidity')} value={`${weather.humidity}%`} />
                <Metric icon={<Sun className=\"h-3.5 w-3.5 text-gold\" />} label={t('uvShort')} value={`${weather.uvIndex}`} />
                <Metric icon={<Wind className=\"h-3.5 w-3.5 text-primary\" />} label={t('wind')} value={`${weather.windKmph} km/h`} />
                <Metric icon={<Umbrella className=\"h-3.5 w-3.5 text-primary\" />} label={t('precipShort')} value={`${weather.precipMm} mm`} />
                <Metric icon={<Thermometer className=\"h-3.5 w-3.5 text-gold\" />} label={t('tomorrow')} value={`${weather.tomorrowMinC}–${weather.tomorrowMaxC}°C`} />
                <Metric icon={<CloudRain className=\"h-3.5 w-3.5 text-primary\" />} label={t('rainTomorrow')} value={`${weather.tomorrowChanceRain}%`} />
              </div>
            </div>
          </CardContent>
        </Card>
        <Card className=\"border-gold/40 bg-gold/5\">
          <CardHeader className=\"pb-3\">
            <CardTitle className=\"flex items-center gap-2 font-display text-base\"><Sparkles className=\"h-4 w-4 text-gold\" />{t('smartWeather')}<Badge variant=\"outline\" className=\"ml-1 border-gold/40 text-gold\">{tNav('premium')}</Badge></CardTitle>
            <CardDescription>{t('subtitle')}</CardDescription>
          </CardHeader>
          {onNavigate && <CardContent className=\"pt-0\"><Button onClick={() => onNavigate('paywall')} className=\"bg-gradient-to-r from-primary to-gold text-primary-foreground\"><Crown className=\"h-4 w-4\" />{tNav('premium')}</Button></CardContent>}
        </Card>
        <Card className=\"glass-card\">
          <CardHeader className=\"pb-2\"><CardTitle className=\"font-display text-base\">{t('forecast3days')}</CardTitle></CardHeader>
          <CardContent><div className=\"grid grid-cols-3 gap-2\">{weather.next3days.map((d, i) => <div key={i} className=\"flex flex-col items-center gap-1 rounded-xl border border-border/50 bg-background/40 p-3 text-center\"><span className=\"text-[10px] font-semibold uppercase tracking-wide text-muted-foreground\">{i === 0 ? t('today') : i === 1 ? t('tomorrow') : new Date(d.date).toLocaleDateString(locale, { weekday: 'short' })}</span><span className=\"text-2xl\">{codeToIcon(d.code)}</span><span className=\"font-display text-lg font-bold text-primary\">{d.maxC}°C</span><span className=\"flex items-center gap-0.5 text-[10px] text-muted-foreground\"><CloudRain className=\"h-3 w-3\" />{d.chanceRain}%</span></div>)}</div></CardContent>
        </Card>
      </div>
    )
  }

  const topAlert = assessment.alerts[0]
  const algae = ALGAE_CFG[assessment.algaeRisk]
  const swim = SWIM_CFG[assessment.swimComfort]

  return (
"""
          if old not in s: raise SystemExit('weather anchor not found')
          p.write_text(s.replace(old,new,1))

          p=Path('src/components/aquamind/app-shell.tsx'); s=p.read_text()
          s=s.replace('w-56 shrink-0 overflow-y-auto border-r border-border/40 py-6 pr-4 md:block','w-72 shrink-0 overflow-y-auto border-r border-border/40 py-6 pr-5 md:block',1)
          s=s.replace('<span className="truncate">{item.label}</span>','<span className="min-w-0 flex-1 whitespace-normal text-left leading-tight">{item.label}</span>',1)
          p.write_text(s)

          Path('tests/weather-sidebar-regression.test.ts').write_text("""import { describe, expect, test } from 'bun:test'\nimport { readFileSync } from 'node:fs'\nconst weather = readFileSync('src/components/aquamind/module-weather.tsx','utf8')\nconst shell = readFileSync('src/components/aquamind/app-shell.tsx','utf8')\ndescribe('weather/sidebar regression',()=>{\n test('gated weather keeps basic UI',()=>{ expect(weather).toContain('assessment: Assessment | null'); expect(weather).toContain('if (!assessment)'); expect(weather.indexOf('if (!assessment)')).toBeLessThan(weather.indexOf('assessment.alerts[0]')); expect(weather).toContain(\"onNavigate('paywall')\") })\n test('desktop labels are not truncated',()=>{ expect(shell).toContain('w-72 shrink-0'); expect(shell).toContain('whitespace-normal text-left leading-tight'); expect(shell).not.toContain('<span className=\\\"truncate\\\">{item.label}</span>') })\n})\n""")
          for f in ['.github/workflows/pr104-weather-sidebar-once.yml','.github/workflows/pr104-apply.yml']:
            Path(f).unlink(missing_ok=True)
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(weather): prevent gated crash and widen desktop sidebar"
          git push origin HEAD:fix/pr104-weather-sidebar
