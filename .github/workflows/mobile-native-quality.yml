name: Mobile Native Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feat/wave-a3-mobile-b2c-sandbox-foundation

permissions:
  contents: read

jobs:
  static:
    name: Mobile static (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: file:/tmp/aqwelia-mobile-ci.db
      NEXTAUTH_SECRET: test-secret-for-ci-only-do-not-use-in-production
      NEXTAUTH_URL: http://localhost:3098
      AUTH_TRUST_HOST: "true"
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_test_ci_placeholder
      REVENUECAT_WEBHOOK_SECRET: rc_wh_test_ci_only
      # Public fixture keys — explicitly recognised as test-only (never a real
      # RevenueCat validation; only a build/shape guard).
      NEXT_PUBLIC_API_BASE_URL: https://api.aqwelia.app
      NEXT_PUBLIC_REVENUECAT_IOS_KEY: appl_public_ci_fixture_key
      NEXT_PUBLIC_REVENUECAT_ANDROID_KEY: goog_public_ci_fixture_key
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma clients
        run: bun run db:generate:all
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Billing & mobile tests
        run: bunx vitest run tests/billing-a2-round1-critical.test.ts tests/billing-a2-round4-boundary.test.ts tests/billing-a2-round5-purchase-contract.test.ts tests/billing-a2-round6-server-authority.test.ts tests/billing-a2-round7-restore-toast.test.ts tests/wave-a3-mobile-b2c.test.ts tests/b2c-pricing.test.ts tests/p0-j.test.ts
      - name: Mobile environment preflight
        run: node scripts/mobile-env-preflight.mjs
      - name: Build mobile (B2C shell)
        run: bun run mobile:build
      - name: Assert exported B2C + Pro routes
        run: |
          set -euo pipefail
          for route in /auth/signin /auth/register /dashboard /pricing /settings /settings/subscription /pro/app/today /pro/app/report; do
            test -f "out${route}.html" || { echo "Missing mobile route ${route}.html"; exit 1; }
          done
      - name: Mobile bundle guard
        run: node scripts/check-mobile-bundle.mjs

  android:
    name: Android debug build (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: file:/tmp/aqwelia-mobile-android.db
      NEXTAUTH_SECRET: test-secret-for-ci-only-do-not-use-in-production
      NEXT_PUBLIC_API_BASE_URL: https://api.aqwelia.app
      NEXT_PUBLIC_REVENUECAT_IOS_KEY: appl_public_ci_fixture_key
      NEXT_PUBLIC_REVENUECAT_ANDROID_KEY: goog_public_ci_fixture_key
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma clients
        run: bun run db:generate:all
      - name: Build mobile
        run: bun run mobile:build
      - name: Sync Android
        run: npx cap sync android
      - name: Verify AndroidManifest (INTERNET, launchMode, RevenueCat)
        run: |
          set -euo pipefail
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          grep -Eq 'android:launchMode="(standard|singleTop)"' android/app/src/main/AndroidManifest.xml
          grep -q 'revenuecat-purchases-capacitor' android/capacitor.settings.gradle
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aqwelia-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS simulator build (macOS)
    runs-on: macos-14
    timeout-minutes: 45
    env:
      DATABASE_URL: file:/tmp/aqwelia-mobile-ios.db
      NEXTAUTH_SECRET: test-secret-for-ci-only-do-not-use-in-production
      NEXT_PUBLIC_API_BASE_URL: https://api.aqwelia.app
      NEXT_PUBLIC_REVENUECAT_IOS_KEY: appl_public_ci_fixture_key
      NEXT_PUBLIC_REVENUECAT_ANDROID_KEY: goog_public_ci_fixture_key
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma clients
        run: bun run db:generate:all
      - name: Build mobile
        run: bun run mobile:build
      - name: Sync iOS
        run: npx cap sync ios
      - name: Verify iOS project (Bundle ID, In-App Purchase, Swift 5+, RevenueCat)
        run: |
          set -euo pipefail
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.aqwelia.app' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'com.apple.InAppPurchase' ios/App/App/App.entitlements
          grep -q 'SWIFT_VERSION = 5.0' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'RevenuecatPurchasesCapacitor' ios/App/CapApp-SPM/Package.swift
      - name: Build iOS app for simulator (no distribution signing)
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | tee /tmp/ios-build.log | tail -40
      - name: Upload iOS build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: /tmp/ios-build.log
          if-no-files-found: error
          retention-days: 7
