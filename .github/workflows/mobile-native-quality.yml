name: Mobile Native Quality

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: Mobile static (Linux)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: file:/tmp/aqwelia-mobile-ci.db
      NEXTAUTH_SECRET: test-secret-for-ci-only-do-not-use-in-production
      NEXTAUTH_URL: http://localhost:3098
      AUTH_TRUST_HOST: "true"
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_test_ci_placeholder
      REVENUECAT_WEBHOOK_SECRET: rc_wh_test_ci_only
      NEXT_PUBLIC_API_BASE_URL: https://api.aqwelia.app
      NEXT_PUBLIC_REVENUECAT_IOS_KEY: appl_public_ci_fixture_key
      NEXT_PUBLIC_REVENUECAT_ANDROID_KEY: goog_public_ci_fixture_key
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma clients
        run: bun run db:generate:all
      - name: Push schema + create test user (billing tests need tables)
        run: |
          bunx prisma db push
          node tests/create-test-user.mjs
      - name: Lint
        run: bun run lint
      - name: Typecheck
        run: bun run typecheck
      - name: Billing & mobile tests
        run: bunx vitest run tests/billing-a2-round1-critical.test.ts tests/billing-a2-round4-boundary.test.ts tests/billing-a2-round5-purchase-contract.test.ts tests/billing-a2-round6-server-authority.test.ts tests/billing-a2-round7-restore-toast.test.ts tests/wave-a3-mobile-b2c.test.ts tests/wave-a3-mobile-runtime-hardening.test.ts tests/wave-a4-mobile-auth-cookie-hardening.test.ts tests/launch-r1-staging-billing-runtime.test.ts tests/b2c-pricing.test.ts tests/p0-j.test.ts
      - name: Mobile environment preflight
        env:
          DATABASE_URL: ""
          NEXTAUTH_SECRET: ""
          STRIPE_SECRET_KEY: ""
          STRIPE_WEBHOOK_SECRET: ""
          REVENUECAT_WEBHOOK_SECRET: ""
        run: node scripts/mobile-env-preflight.mjs
      - name: Build mobile (B2C shell)
        run: bun run mobile:build
      - name: Assert exported B2C + Pro routes
        run: |
          set -euo pipefail
          for route in /auth/signin /auth/register /dashboard /pricing /settings /settings/subscription /settings/subscription/diagnostics /pro/app/today /pro/app/report; do
            test -f "out${route}.html" || { echo "Missing mobile route ${route}.html"; exit 1; }
          done
      - name: Mobile bundle guard
        run: node scripts/check-mobile-bundle.mjs

  android:
    name: Android debug build (Linux)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: file:/tmp/aqwelia-mobile-android.db
      NEXTAUTH_SECRET: test-secret-for-ci-only-do-not-use-by-mobile-runtime
      NEXT_PUBLIC_API_BASE_URL: https://api.aqwelia.app
      NEXT_PUBLIC_REVENUECAT_IOS_KEY: appl_public_ci_fixture_key
      NEXT_PUBLIC_REVENUECAT_ANDROID_KEY: goog_public_ci_fixture_key
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma clients
        run: bun run db:generate:all
      - name: Build mobile
        run: bun run mobile:build
      - name: Sync Android
        run: npx cap sync android
      - name: Verify AndroidManifest (INTERNET, launchMode, RevenueCat)
        run: |
          set -euo pipefail
          grep -q 'android.permission.INTERNET' android/app/src/main/AndroidManifest.xml
          grep -Eq 'android:launchMode="(standard|singleTop)"' android/app/src/main/AndroidManifest.xml
          grep -q 'revenuecat-purchases-capacitor' android/capacitor.settings.gradle
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: aqwelia-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS simulator build (macOS)
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DATABASE_URL: file:/tmp/aqwelia-mobile-ios.db
      NEXTAUTH_SECRET: test-secret-for-ci-only-do-not-use-in-production
      NEXT_PUBLIC_API_BASE_URL: https://api.aqwelia.app
      NEXT_PUBLIC_REVENUECAT_IOS_KEY: appl_public_ci_fixture_key
      NEXT_PUBLIC_REVENUECAT_ANDROID_KEY: goog_public_ci_fixture_key
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"
      - name: Verify Xcode 26
        run: |
          set -euo pipefail
          success=0
          for attempt in 1 2 3; do
            echo "Xcode version probe attempt ${attempt}/3"
            if version_output="$(xcodebuild -version 2>&1)"; then
              echo "${version_output}"
              echo "${version_output}" | grep -Eq '^Xcode 26(\.|$)'
              success=1
              break
            fi
            status=$?
            echo "xcodebuild -version failed on attempt ${attempt} (exit ${status})"
            if [ "${attempt}" -lt 3 ]; then sleep 5; fi
          done
          if [ "${success}" -ne 1 ]; then
            echo "Xcode 26 preflight failed after 3 attempts"
            exit 1
          fi
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma clients
        run: bun run db:generate:all
      - name: Build mobile
        run: bun run mobile:build
      - name: Sync iOS
        run: npx cap sync ios
      - name: Verify iOS project (Bundle ID, In-App Purchase, Swift 5+, RevenueCat, App-Bound Domains)
        run: |
          set -euo pipefail
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.aqwelia.app' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'com.apple.InAppPurchase = {' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'SWIFT_VERSION = 5.0' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'RevenuecatPurchasesCapacitor' ios/App/CapApp-SPM/Package.swift
          grep -q '<key>WKAppBoundDomains</key>' ios/App/App/Info.plist
          grep -q '<string>aqwelia-staging.vercel.app</string>' ios/App/App/Info.plist
          grep -q '<string>aqwelia-staging-git-release-aqwelia-launch-ejd5s-projects.vercel.app</string>' ios/App/App/Info.plist
          grep -q '<string>aqwelia-production.vercel.app</string>' ios/App/App/Info.plist
          if grep -q '<key>com.apple.InAppPurchase</key>' ios/App/App/App.entitlements; then
            echo 'Invalid In-App Purchase signing entitlement detected'
            exit 1
          fi
      - name: Build iOS app for simulator (no distribution signing)
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | tee /tmp/ios-build.log | tail -40
      - name: Upload iOS build log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: /tmp/ios-build.log
          if-no-files-found: error
          retention-days: 7

  android-sandbox:
    name: Android Staging sandbox APK
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.head_ref == 'release/aqwelia-launch')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: staging
    env:
      DATABASE_URL: file:/tmp/aqwelia-mobile-staging.db
      NEXTAUTH_SECRET: staging-build-only-not-used-by-mobile-runtime
      NEXT_PUBLIC_API_BASE_URL: ${{ vars.AQWELIA_STAGING_API_BASE_URL || 'https://aqwelia-staging-git-release-aqwelia-launch-ejd5s-projects.vercel.app' }}
      NEXT_PUBLIC_REVENUECAT_IOS_KEY: ${{ secrets.NEXT_PUBLIC_REVENUECAT_IOS_KEY || vars.NEXT_PUBLIC_REVENUECAT_IOS_KEY }}
      NEXT_PUBLIC_REVENUECAT_ANDROID_KEY: ${{ secrets.NEXT_PUBLIC_REVENUECAT_ANDROID_KEY || vars.NEXT_PUBLIC_REVENUECAT_ANDROID_KEY }}
      NEXT_PUBLIC_MOBILE_SANDBOX_DIAGNOSTICS: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Validate real Staging mobile environment
        run: |
          set -euo pipefail
          test -n "${NEXT_PUBLIC_API_BASE_URL:-}"
          test -n "${NEXT_PUBLIC_REVENUECAT_IOS_KEY:-}"
          test -n "${NEXT_PUBLIC_REVENUECAT_ANDROID_KEY:-}"
          echo "${NEXT_PUBLIC_API_BASE_URL}" | grep -Eq '^https://'
          echo "${NEXT_PUBLIC_REVENUECAT_IOS_KEY}" | grep -Eq '^appl_'
          echo "${NEXT_PUBLIC_REVENUECAT_ANDROID_KEY}" | grep -Eq '^goog_'
          case "${NEXT_PUBLIC_API_BASE_URL}" in
            https://api.aqwelia.app|https://aqwelia-production.vercel.app)
              echo 'Refusing to build sandbox APK against Production'
              exit 1
              ;;
          esac
          if echo "${NEXT_PUBLIC_REVENUECAT_IOS_KEY}${NEXT_PUBLIC_REVENUECAT_ANDROID_KEY}" | grep -q 'fixture'; then
            echo 'Refusing fixture RevenueCat keys for sandbox APK'
            exit 1
          fi
      - name: Verify Staging backend is sandbox-ready
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/aqwelia-sandbox-readiness.json -w '%{http_code}' "${NEXT_PUBLIC_API_BASE_URL}/api/mobile/sandbox-readiness")"
          cat /tmp/aqwelia-sandbox-readiness.json
          test "${status}" = "200"
          node -e "const r=require('/tmp/aqwelia-sandbox-readiness.json'); if(r.ok!==true || r.billingAccessEnvironment!=='sandbox' || r.deploymentEnvironment!=='staging') process.exit(1)"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Generate Prisma clients
        run: bun run db:generate:all
      - name: Build mobile against Staging
        run: bun run mobile:build
      - name: Sync Android
        run: npx cap sync android
      - name: Build sandbox debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon
      - name: Prepare sandbox artifact manifest
        run: |
          set -euo pipefail
          mkdir -p sandbox-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk sandbox-artifacts/aqwelia-staging-sandbox.apk
          node <<'NODE'
          const fs = require('fs')
          const manifest = {
            sha: process.env.GITHUB_SHA,
            branch: process.env.GITHUB_REF_NAME,
            backend: process.env.NEXT_PUBLIC_API_BASE_URL,
            diagnostics: true,
            revenueCatIosKeyConfigured: Boolean(process.env.NEXT_PUBLIC_REVENUECAT_IOS_KEY),
            revenueCatAndroidKeyConfigured: Boolean(process.env.NEXT_PUBLIC_REVENUECAT_ANDROID_KEY),
          }
          fs.writeFileSync('sandbox-artifacts/manifest.json', JSON.stringify(manifest, null, 2) + '\n')
          NODE
      - name: Upload Staging sandbox APK
        uses: actions/upload-artifact@v4
        with:
          name: aqwelia-staging-sandbox-apk-${{ github.sha }}
          path: sandbox-artifacts/
          if-no-files-found: error
          retention-days: 14
