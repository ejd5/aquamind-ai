name: Diagnose P1-C smoke failure

on:
  push:
    branches:
      - feat/pro-live-dispatch-foundation
    paths:
      - P1C_SMOKE_DIAG.md

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pro-live-dispatch-foundation
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - run: bun install --frozen-lockfile
      - name: Run smoke and capture focused failure output
        env:
          DATABASE_URL: file:/tmp/aqwelia-ci.db
          NEXTAUTH_SECRET: test-secret-for-ci-only-do-not-use-in-production
          NEXTAUTH_URL: http://localhost:3099
          AUTH_TRUST_HOST: 'true'
          STRIPE_SECRET_KEY: sk_test_ci_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_test_ci_placeholder
          REVENUECAT_WEBHOOK_SECRET: rc_wh_test_ci_only
        run: |
          bash tests/run-smoke-tests.sh > /tmp/p1c-smoke.log 2>&1 || true
          printf '# P1-C smoke diagnostic\n\n```text\n' > docs/pro/P1C_SMOKE_DIAGNOSTIC.md
          grep -n -E '^\(fail\)|^[0-9]+ tests failed|error:|AssertionError|expect\(' /tmp/p1c-smoke.log >> docs/pro/P1C_SMOKE_DIAGNOSTIC.md || true
          printf '\n--- LAST 180 LINES ---\n' >> docs/pro/P1C_SMOKE_DIAGNOSTIC.md
          tail -180 /tmp/p1c-smoke.log >> docs/pro/P1C_SMOKE_DIAGNOSTIC.md
          printf '\n```\n' >> docs/pro/P1C_SMOKE_DIAGNOSTIC.md
      - name: Commit diagnostic safely
        run: |
          rm -f P1C_SMOKE_DIAG.md
          rm -f .github/workflows/diagnose-p1-c-smoke.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f docs/pro/P1C_SMOKE_DIAGNOSTIC.md
          git add -A
          git commit -m 'chore(p1-c): capture smoke diagnostic [skip ci]'
          git pull --rebase origin feat/pro-live-dispatch-foundation
          git push origin HEAD:feat/pro-live-dispatch-foundation
