name: P1-C concise diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:/tmp/aqwelia-ci.db
      NEXTAUTH_SECRET: test-secret-for-ci-only-do-not-use-in-production
      NEXTAUTH_URL: http://localhost:3099
      AUTH_TRUST_HOST: "true"
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_test_ci_placeholder
      REVENUECAT_WEBHOOK_SECRET: rc_wh_test_ci_only
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"
      - run: bun install --frozen-lockfile >/dev/null
      - run: bun run db:generate:all >/dev/null
      - name: Run smoke suite and extract failure blocks
        id: smoke
        shell: bash
        run: |
          set +e
          bash tests/run-smoke-tests.sh > /tmp/p1c-smoke.log 2>&1
          status=$?
          set -e
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('/tmp/p1c-smoke.log').read_text(errors='replace').splitlines()
          markers = (' FAIL ', 'Failed Tests', 'AssertionError', 'expected', 'Error:', 'SMOKE TESTS FAILED')
          hits = [i for i, line in enumerate(lines) if any(marker in line for marker in markers)]
          selected = set()
          for hit in hits:
              selected.update(range(max(0, hit - 6), min(len(lines), hit + 30)))
          if not selected:
              selected.update(range(max(0, len(lines) - 150), len(lines)))
          output = []
          previous = None
          for index in sorted(selected):
              if previous is not None and index > previous + 1:
                  output.append('\n--- omitted ---\n')
              output.append(lines[index])
              previous = index
          Path('/tmp/p1c-failure.txt').write_text('\n'.join(output) + '\n')
          print('\n'.join(output))
          PY
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Upload concise diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p1c-smoke-diagnostic
          path: /tmp/p1c-failure.txt
          retention-days: 1
      - name: Fail when smoke suite failed
        if: steps.smoke.outputs.status != '0'
        run: exit 1
