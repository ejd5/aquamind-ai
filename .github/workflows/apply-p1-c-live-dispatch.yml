name: Apply P1-C live dispatch foundation

on:
  push:
    branches:
      - feat/pro-live-dispatch-foundation
    paths:
      - P1C_LIVE_DISPATCH_TRIGGER.txt

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/pro-live-dispatch-foundation
          fetch-depth: 1
      - name: Apply schema and navigation patches
        run: |
          cat .p1c-payload-00 .p1c-payload-01 .p1c-payload-02 | base64 -d | gzip -d > /tmp/apply-p1-c-live-dispatch.py
          python /tmp/apply-p1-c-live-dispatch.py
      - name: Remove one-time helpers
        run: |
          rm -f P1C_LIVE_DISPATCH_TRIGGER.txt
          rm -f .p1c-payload-00 .p1c-payload-01 .p1c-payload-02
          rm -f .github/workflows/apply-p1-c-live-dispatch.yml
      - name: Commit generated foundation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(p1-c): add live GPS dispatch foundation'
          git push origin HEAD:feat/pro-live-dispatch-foundation
