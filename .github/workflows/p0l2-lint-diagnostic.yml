name: P0-L2 concise lint diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"
      - run: bun install --frozen-lockfile >/dev/null
      - name: Capture lint output
        id: lint
        shell: bash
        run: |
          set +e
          bun run lint > /tmp/p0l2-lint.txt 2>&1
          status=$?
          set -e
          cat /tmp/p0l2-lint.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Upload lint diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0l2-lint-diagnostic
          path: /tmp/p0l2-lint.txt
          retention-days: 1
      - name: Fail when lint failed
        if: steps.lint.outputs.status != '0'
        run: exit 1
