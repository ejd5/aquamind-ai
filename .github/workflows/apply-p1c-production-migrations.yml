name: Apply P1-C production migrations

on:
  push:
    branches:
      - ops/apply-p1c-production-migrations
    paths:
      - .github/workflows/apply-p1c-production-migrations.yml

permissions:
  contents: read
  statuses: write

concurrency:
  group: aqwelia-p1c-production-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply Dispatch Live migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}
    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"context\":\"AQWELIA P1-C production migrations\",\"description\":\"Migration Dispatch Live en cours\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate direct production connection
        run: |
          node - <<'NODE'
          const url = process.env.DATABASE_URL || ''
          if (!/^postgres(ql)?:\/\//.test(url)) {
            throw new Error('PRODUCTION_DIRECT_URL is required and must be PostgreSQL')
          }
          const parsed = new URL(url)
          if (parsed.hostname.includes('-pooler')) {
            throw new Error('Prisma migrate deploy must use the direct Neon connection, not the pooler')
          }
          if (!parsed.hostname.includes('neon.tech')) {
            throw new Error('Production migration target is expected to be Neon')
          }
          NODE

      - name: Generate PostgreSQL Prisma client
        run: bun run db:pg:generate

      - name: Apply pending PostgreSQL migrations
        id: migrate
        run: bunx prisma migrate deploy --schema prisma/postgresql/schema.prisma

      - name: Verify P1-C migrations and structures
        run: |
          node - <<'NODE'
          const { createRequire } = require('node:module')
          const localRequire = createRequire(process.cwd() + '/verify-p1c.mjs')
          const { PrismaClient } = localRequire('./generated/client-postgresql')
          const prisma = new PrismaClient()
          async function main() {
            const migrations = await prisma.$queryRawUnsafe(`
              SELECT migration_name, finished_at, rolled_back_at
              FROM "_prisma_migrations"
              WHERE migration_name IN (
                '20260725003000_p1_c_live_dispatch',
                '20260725020000_p1_c_gps_devices'
              )
            `)
            const completed = new Set(
              migrations
                .filter((row) => row.finished_at && !row.rolled_back_at)
                .map((row) => row.migration_name)
            )
            for (const name of [
              '20260725003000_p1_c_live_dispatch',
              '20260725020000_p1_c_gps_devices',
            ]) {
              if (!completed.has(name)) throw new Error(`Migration not completed: ${name}`)
            }

            const structures = await prisma.$queryRawUnsafe(`
              SELECT table_name
              FROM information_schema.tables
              WHERE table_schema = 'public'
                AND table_name IN (
                  'ProTrackingSession',
                  'ProLocationPoint',
                  'ProLocationAccessLog',
                  'ProTrackingDevice'
                )
            `)
            const tables = new Set(structures.map((row) => row.table_name))
            for (const name of [
              'ProTrackingSession',
              'ProLocationPoint',
              'ProLocationAccessLog',
              'ProTrackingDevice',
            ]) {
              if (!tables.has(name)) throw new Error(`Production structure missing: ${name}`)
            }

            const columns = await prisma.$queryRawUnsafe(`
              SELECT column_name
              FROM information_schema.columns
              WHERE table_schema = 'public'
                AND table_name = 'ProLocationPoint'
                AND column_name IN ('deviceId', 'externalEventId')
            `)
            if (new Set(columns.map((row) => row.column_name)).size !== 2) {
              throw new Error('ProLocationPoint GPS device columns are incomplete')
            }
            console.log('P1-C production migrations and structures verified')
          }
          main()
            .finally(() => prisma.$disconnect())
            .catch((error) => {
              console.error(error)
              process.exit(1)
            })
          NODE

      - name: Publish final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          MIGRATION_OUTCOME: ${{ steps.migrate.outcome }}
        run: |
          if [ "${MIGRATION_OUTCOME}" = "success" ]; then
            STATE=success
            DESCRIPTION="Migrations Dispatch Live appliquées"
          else
            STATE=failure
            DESCRIPTION="Échec des migrations Dispatch Live"
          fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"${STATE}\",\"context\":\"AQWELIA P1-C production migrations\",\"description\":\"${DESCRIPTION}\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
