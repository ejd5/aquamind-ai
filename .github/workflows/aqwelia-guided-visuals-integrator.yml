name: AQWELIA guided visuals integrator

on:
  push:
    branches:
      - feat/aqwelia-guided-visuals

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message, '[guided-integrated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/aqwelia-guided-visuals
          fetch-depth: 0

      - name: Wire visual assets into guided UI
        shell: python
        run: |
          from pathlib import Path

          strip_path = Path('src/components/aquamind/strip-scanner.tsx')
          strip = strip_path.read_text()
          replacements = [
              (
                  "{ icon: Lightbulb, title: t('guideStep1Title'), text: t('guideStep1Text'), illustration: t('guideStep1Illustration') },",
                  "{ icon: Lightbulb, title: t('guideStep1Title'), text: t('guideStep1Text'), illustration: t('guideStep1Illustration') || '/guides/stripscan/stripscan-guide-1-prepare.svg' },",
              ),
              (
                  "{ icon: Camera, title: t('guideStep2Title'), text: t('guideStep2Text'), illustration: t('guideStep2Illustration') },",
                  "{ icon: Camera, title: t('guideStep2Title'), text: t('guideStep2Text'), illustration: t('guideStep2Illustration') || '/guides/stripscan/stripscan-guide-2-lighting.svg' },",
              ),
              (
                  "{ icon: ScanLine, title: t('guideStep3Title'), text: t('guideStep3Text'), illustration: t('guideStep3Illustration') },",
                  "{ icon: ScanLine, title: t('guideStep3Title'), text: t('guideStep3Text'), illustration: t('guideStep3Illustration') || '/guides/stripscan/stripscan-guide-3-align.svg' },",
              ),
          ]
          for old, new in replacements:
              if old not in strip:
                  raise SystemExit(f'Missing StripScan anchor: {old}')
              strip = strip.replace(old, new, 1)
          strip_path.write_text(strip)

          diag_path = Path('src/components/aquamind/module-diagnostic.tsx')
          diag = diag_path.read_text()
          anchor = """            </div>\n\n            {!image ? ("""
          if diag.count(anchor) != 1:
              raise SystemExit(f'Expected exactly one Photo Diagnostic insertion anchor, found {diag.count(anchor)}')
          visual_guide = """            </div>\n\n            {/* Language-neutral visual guidance. Text remains native next-intl content\n                in all supported locales; these images are supplemental/decorative. */}\n            <div\n              className=\"-mx-1 flex snap-x gap-2 overflow-x-auto px-1 pb-1 sm:mx-0 sm:grid sm:grid-cols-3 sm:overflow-visible sm:px-0\"\n              aria-hidden=\"true\"\n            >\n              {[\n                '/guides/photo-diagnostic/photo-diagnostic-guide-1-overview.svg',\n                '/guides/photo-diagnostic/photo-diagnostic-guide-2-closeup.svg',\n                '/guides/photo-diagnostic/photo-diagnostic-guide-3-frame.svg',\n              ].map((src) => (\n                <div\n                  key={src}\n                  className=\"min-w-[44%] snap-start overflow-hidden rounded-xl border border-gold/20 bg-background/60 sm:min-w-0\"\n                >\n                  <img\n                    src={src}\n                    alt=\"\"\n                    loading=\"lazy\"\n                    className=\"aspect-square w-full object-cover\"\n                  />\n                </div>\n              ))}\n            </div>\n\n            {!image ? ("""
          diag = diag.replace(anchor, visual_guide, 1)
          diag_path.write_text(diag)

      - name: Commit integration
        run: |
          if git diff --quiet; then
            echo "Nothing to integrate"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/aquamind/strip-scanner.tsx src/components/aquamind/module-diagnostic.tsx
          git commit -m "feat(guides): wire AQWELIA guided visuals [guided-integrated]"
          git push origin HEAD:feat/aqwelia-guided-visuals
