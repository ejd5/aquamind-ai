name: AQWELIA guided visuals round 2

on:
  push:
    branches:
      - feat/aqwelia-guided-visuals

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/aqwelia-guided-visuals
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Apply deterministic visuals + i18n guide
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          root = Path('.')

          svgs = {
          'public/guides/stripscan/stripscan-guide-1-prepare.svg': '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8ffff"/><stop offset="1" stop-color="#e7f7f5"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity=".12"/></filter></defs><rect width="640" height="360" rx="28" fill="url(#bg)"/><rect x="70" y="42" width="500" height="276" rx="22" fill="#fff" filter="url(#s)"/><rect x="150" y="78" width="28" height="205" rx="12" fill="#fafafa" stroke="#cbd9d8"/><rect x="150" y="96" width="28" height="25" rx="4" fill="#f3a33b"/><rect x="150" y="130" width="28" height="25" rx="4" fill="#d84d73"/><rect x="150" y="164" width="28" height="25" rx="4" fill="#f3c52d"/><rect x="150" y="198" width="28" height="25" rx="4" fill="#c8d85a"/><rect x="150" y="232" width="28" height="25" rx="4" fill="#8d739c"/><rect x="310" y="78" width="180" height="205" rx="20" fill="#f7faf9" stroke="#0a7f80" stroke-width="5"/><g transform="translate(336 103)"><g fill="#f1c895"><rect width="25" height="25" rx="5"/><rect x="34" width="25" height="25" rx="5" fill="#f0a33c"/><rect x="68" width="25" height="25" rx="5" fill="#e57b2f"/><rect x="102" width="25" height="25" rx="5" fill="#d85a39"/></g><g transform="translate(0 39)"><rect width="25" height="25" rx="5" fill="#ef9a31"/><rect x="34" width="25" height="25" rx="5" fill="#e85b42"/><rect x="68" width="25" height="25" rx="5" fill="#d9446a"/><rect x="102" width="25" height="25" rx="5" fill="#b4387a"/></g><g transform="translate(0 78)"><rect width="25" height="25" rx="5" fill="#f5cf3e"/><rect x="34" width="25" height="25" rx="5" fill="#e9a37b"/><rect x="68" width="25" height="25" rx="5" fill="#bb75a8"/><rect x="102" width="25" height="25" rx="5" fill="#865b91"/></g><g transform="translate(0 117)"><rect width="25" height="25" rx="5" fill="#d9cf4c"/><rect x="34" width="25" height="25" rx="5" fill="#a8bd50"/><rect x="68" width="25" height="25" rx="5" fill="#59a978"/><rect x="102" width="25" height="25" rx="5" fill="#27888b"/></g></g><path d="M235 70v220" stroke="#0a7f80" stroke-width="3" stroke-dasharray="8 10" opacity=".35"/></svg>''',
          'public/guides/stripscan/stripscan-guide-2-lighting.svg': '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img"><defs><linearGradient id="sky" y2="1"><stop stop-color="#e9fbff"/><stop offset="1" stop-color="#bfeeee"/></linearGradient><linearGradient id="water" y2="1"><stop stop-color="#3fd6d2"/><stop offset="1" stop-color="#078e9e"/></linearGradient></defs><rect width="640" height="360" rx="28" fill="url(#sky)"/><circle cx="112" cy="82" r="38" fill="#ffd45b"/><g stroke="#ffd45b" stroke-width="8" stroke-linecap="round"><path d="M112 20v20M112 124v20M50 82h20M154 82h20M68 38l14 14M142 112l14 14M156 38l-14 14M82 112l-14 14"/></g><path d="M0 205C120 170 220 226 340 190s196-20 300 12v158H0z" fill="url(#water)"/><path d="M0 238c130-32 220 35 340 0s190-21 300 8" fill="none" stroke="#bff7f3" stroke-width="6" opacity=".65"/><g transform="translate(285 55)"><rect x="0" y="0" width="28" height="225" rx="12" fill="#fafafa" stroke="#cad9d7"/><rect y="24" width="28" height="27" rx="4" fill="#f3a33b"/><rect y="62" width="28" height="27" rx="4" fill="#d84d73"/><rect y="100" width="28" height="27" rx="4" fill="#f3c52d"/><rect y="138" width="28" height="27" rx="4" fill="#c8d85a"/><rect y="176" width="28" height="27" rx="4" fill="#8d739c"/></g><ellipse cx="299" cy="290" rx="86" ry="18" fill="#003f48" opacity=".12"/><path d="M245 70c-35 40-40 105-12 148" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity=".7"/><path d="M355 72c30 44 31 108 4 148" fill="none" stroke="#fff" stroke-width="12" stroke-linecap="round" opacity=".7"/></svg>''',
          'public/guides/stripscan/stripscan-guide-3-align.svg': '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img"><defs><linearGradient id="bg" y2="1"><stop stop-color="#edfdfb"/><stop offset="1" stop-color="#d3f0ef"/></linearGradient></defs><rect width="640" height="360" rx="28" fill="url(#bg)"/><rect x="72" y="58" width="496" height="244" rx="38" fill="#172327" stroke="#06191d" stroke-width="8"/><rect x="116" y="82" width="408" height="196" rx="18" fill="#f9ffff"/><rect x="250" y="104" width="24" height="148" rx="10" fill="#fbfbfb" stroke="#cad8d7"/><rect x="250" y="118" width="24" height="20" rx="3" fill="#f3a33b"/><rect x="250" y="145" width="24" height="20" rx="3" fill="#d84d73"/><rect x="250" y="172" width="24" height="20" rx="3" fill="#f3c52d"/><rect x="250" y="199" width="24" height="20" rx="3" fill="#c8d85a"/><rect x="340" y="103" width="112" height="150" rx="15" fill="#f6faf9" stroke="#0a7f80" stroke-width="4"/><g fill="none" stroke="#0aa6a4" stroke-width="5" stroke-linecap="round"><path d="M145 112v-20h20M495 112v-20h-20M145 248v20h20M495 248v20h-20"/></g><path d="M140 180h360" stroke="#0aa6a4" stroke-width="4" stroke-dasharray="14 10"/><circle cx="548" cy="180" r="24" fill="#fff" stroke="#889597" stroke-width="4"/></svg>''',
          'public/guides/photo-diagnostic/photo-diagnostic-guide-1-overview.svg': '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img"><defs><linearGradient id="sky" y2="1"><stop stop-color="#bfeafa"/><stop offset="1" stop-color="#f5fbfb"/></linearGradient><linearGradient id="pool" x2="1" y2="1"><stop stop-color="#56dedb"/><stop offset="1" stop-color="#087f96"/></linearGradient></defs><rect width="640" height="360" rx="28" fill="url(#sky)"/><rect y="230" width="640" height="130" fill="#d8c8a8"/><path d="M70 172h500l-58 150H128z" fill="url(#pool)" stroke="#fff" stroke-width="10"/><path d="M100 208c90-22 155 22 235 0s140-20 205 0M112 246c94-21 150 22 231 0s130-19 184 0" stroke="#bff9f4" stroke-width="5" fill="none" opacity=".8"/><rect x="410" y="92" width="145" height="85" rx="7" fill="#fff"/><polygon points="395,96 484,42 575,96" fill="#536b66"/><rect x="438" y="118" width="35" height="59" fill="#95d3d0"/><rect x="490" y="118" width="42" height="35" fill="#bfe3df"/><g fill="#4f936c"><circle cx="75" cy="135" r="38"/><circle cx="120" cy="126" r="26"/><circle cx="575" cy="145" r="32"/></g></svg>''',
          'public/guides/photo-diagnostic/photo-diagnostic-guide-2-closeup.svg': '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img"><defs><linearGradient id="water" y2="1"><stop stop-color="#48d7d0"/><stop offset="1" stop-color="#087f8f"/></linearGradient></defs><rect width="640" height="360" rx="28" fill="#f1efe7"/><rect y="210" width="640" height="150" fill="url(#water)"/><rect x="0" y="78" width="640" height="75" fill="#d9c9aa"/><rect x="0" y="145" width="640" height="76" fill="#d7ddd3"/><path d="M0 180c70-35 110 20 170-3s105 20 165-5 105 22 165-4 90 7 140-10v64H0z" fill="#5d8d53" opacity=".92"/><g fill="#3f7144" opacity=".8"><circle cx="88" cy="177" r="23"/><circle cx="146" cy="188" r="17"/><circle cx="222" cy="173" r="27"/><circle cx="310" cy="190" r="20"/><circle cx="390" cy="174" r="29"/><circle cx="486" cy="191" r="23"/><circle cx="566" cy="176" r="26"/></g><path d="M0 252c125-20 205 30 320 0s200-23 320 6" stroke="#b9f6f0" stroke-width="6" fill="none" opacity=".7"/></svg>''',
          'public/guides/photo-diagnostic/photo-diagnostic-guide-3-frame.svg': '''<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img"><defs><linearGradient id="w" y2="1"><stop stop-color="#47d4cf"/><stop offset="1" stop-color="#0a8194"/></linearGradient></defs><rect width="640" height="360" rx="28" fill="#eef9f7"/><rect x="75" y="48" width="490" height="264" rx="26" fill="#d9caaa"/><rect x="75" y="154" width="490" height="158" fill="url(#w)"/><rect x="75" y="128" width="490" height="78" fill="#d5ddd2"/><path d="M75 175c74-38 118 24 179-4s109 23 171-6 92 18 140-3v51H75z" fill="#4f8750"/><g fill="none" stroke="#0aa6a4" stroke-width="7" stroke-linecap="round"><path d="M130 102V76h28M510 102V76h-28M130 258v26h28M510 258v26h-28"/></g><circle cx="320" cy="180" r="72" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="10 10" opacity=".9"/><circle cx="320" cy="180" r="7" fill="#fff"/></svg>'''
          }
          for path, svg in svgs.items():
              p = root / path
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(svg + '\n', encoding='utf-8')

          strip = root / 'src/components/aquamind/strip-scanner.tsx'
          s = strip.read_text(encoding='utf-8')
          s = s.replace("{ icon: Lightbulb, title: t('guideStep1Title'), text: t('guideStep1Text'), illustration: t('guideStep1Illustration') || '/guides/stripscan/stripscan-guide-1-prepare.svg' },", "{ icon: Lightbulb, title: t('guideStep1Title'), text: t('guideStep1Text'), illustration: '/guides/stripscan/stripscan-guide-1-prepare.svg' },")
          s = s.replace("{ icon: Camera, title: t('guideStep2Title'), text: t('guideStep2Text'), illustration: t('guideStep2Illustration') || '/guides/stripscan/stripscan-guide-2-lighting.svg' },", "{ icon: Camera, title: t('guideStep2Title'), text: t('guideStep2Text'), illustration: '/guides/stripscan/stripscan-guide-2-lighting.svg' },")
          s = s.replace("{ icon: ScanLine, title: t('guideStep3Title'), text: t('guideStep3Text'), illustration: t('guideStep3Illustration') || '/guides/stripscan/stripscan-guide-3-align.svg' },", "{ icon: ScanLine, title: t('guideStep3Title'), text: t('guideStep3Text'), illustration: '/guides/stripscan/stripscan-guide-3-align.svg' },")
          old = '''        {Step.illustration && (\n          <div className="mt-3 overflow-hidden rounded-xl border border-gold/20 bg-background/60">\n            <img\n              src={Step.illustration}\n              alt={Step.title}\n              className="max-h-44 w-full object-cover"\n            />\n          </div>\n        )}'''
          new = '''        {Step.illustration && (\n          <div className="relative mt-3 overflow-hidden rounded-xl border border-gold/20 bg-background/60">\n            <img\n              src={Step.illustration}\n              alt={Step.title}\n              className="h-44 w-full object-contain p-2 sm:h-48"\n            />\n            <img\n              src="/branding/aqwelia-logo-main.png"\n              alt=""\n              aria-hidden="true"\n              className="pointer-events-none absolute bottom-2 right-2 h-7 w-auto object-contain opacity-80"\n            />\n          </div>\n        )}'''
          if old not in s:
              raise SystemExit('Strip illustration block not found')
          s = s.replace(old, new)
          strip.write_text(s, encoding='utf-8')

          mod = root / 'src/components/aquamind/module-diagnostic.tsx'
          m = mod.read_text(encoding='utf-8')
          anchor = "  const [activeTab, setActiveTab] = useState<'photo' | 'strip'>('photo')\n"
          if "photoGuideStep" not in m:
              m = m.replace(anchor, anchor + "  const [photoGuideStep, setPhotoGuideStep] = useState(0)\n")
          steps_anchor = "  const queueAction = useOfflineStore((s) => s.queueAction)\n"
          steps_code = '''  const photoGuideSteps = [\n    { src: '/guides/photo-diagnostic/photo-diagnostic-guide-1-overview.svg', title: t('photoGuideStep1Title'), text: t('photoGuideStep1Text') },\n    { src: '/guides/photo-diagnostic/photo-diagnostic-guide-2-closeup.svg', title: t('photoGuideStep2Title'), text: t('photoGuideStep2Text') },\n    { src: '/guides/photo-diagnostic/photo-diagnostic-guide-3-frame.svg', title: t('photoGuideStep3Title'), text: t('photoGuideStep3Text') },\n  ] as const\n  const activePhotoGuide = photoGuideSteps[photoGuideStep]\n'''
          if "const photoGuideSteps" not in m:
              m = m.replace(steps_anchor, steps_code + steps_anchor)
          old_photo = '''            {/* Language-neutral visual guidance. Text remains native next-intl content\n                in all supported locales; these images are supplemental/decorative. */}\n            <div\n              className="-mx-1 flex snap-x gap-2 overflow-x-auto px-1 pb-1 sm:mx-0 sm:grid sm:grid-cols-3 sm:overflow-visible sm:px-0"\n              aria-hidden="true"\n            >\n              {[\n                '/guides/photo-diagnostic/photo-diagnostic-guide-1-overview.svg',\n                '/guides/photo-diagnostic/photo-diagnostic-guide-2-closeup.svg',\n                '/guides/photo-diagnostic/photo-diagnostic-guide-3-frame.svg',\n              ].map((src) => (\n                <div\n                  key={src}\n                  className="min-w-[44%] snap-start overflow-hidden rounded-xl border border-gold/20 bg-background/60 sm:min-w-0"\n                >\n                  <img\n                    src={src}\n                    alt=""\n                    loading="lazy"\n                    className="aspect-square w-full object-cover"\n                  />\n                </div>\n              ))}\n            </div>'''
          new_photo = '''            <div className="rounded-2xl border border-gold/20 bg-gradient-to-br from-gold/5 to-transparent p-3">\n              <div className="flex items-center justify-between text-[10px] font-semibold uppercase tracking-wide text-gold">\n                <span>{t('photoGuideMode')}</span>\n                <span className="text-muted-foreground">{photoGuideStep + 1}/{photoGuideSteps.length}</span>\n              </div>\n              <div className="relative mt-2 overflow-hidden rounded-xl border border-gold/20 bg-background/60">\n                <img\n                  src={activePhotoGuide.src}\n                  alt={activePhotoGuide.title}\n                  className="h-36 w-full object-contain p-2 sm:h-40"\n                />\n                <img\n                  src="/branding/aqwelia-logo-main.png"\n                  alt=""\n                  aria-hidden="true"\n                  className="pointer-events-none absolute bottom-2 right-2 h-6 w-auto object-contain opacity-80"\n                />\n              </div>\n              <div className="mt-2">\n                <p className="font-display text-sm font-bold">{activePhotoGuide.title}</p>\n                <p className="mt-0.5 text-xs text-muted-foreground">{activePhotoGuide.text}</p>\n              </div>\n              <div className="mt-3 flex items-center gap-2">\n                {photoGuideStep > 0 && (\n                  <Button type="button" variant="outline" size="sm" onClick={() => setPhotoGuideStep((n) => Math.max(0, n - 1))}>\n                    {t('photoGuidePrevious')}\n                  </Button>\n                )}\n                {photoGuideStep < photoGuideSteps.length - 1 && (\n                  <Button type="button" size="sm" className="ml-auto" onClick={() => setPhotoGuideStep((n) => Math.min(photoGuideSteps.length - 1, n + 1))}>\n                    {t('photoGuideNext')}\n                  </Button>\n                )}\n              </div>\n            </div>'''
          if old_photo not in m:
              raise SystemExit('Photo guidance block not found')
          m = m.replace(old_photo, new_photo)
          mod.write_text(m, encoding='utf-8')

          translations = {
            'fr': {'photoGuideMode':'Mode guidé photo','photoGuideStep1Title':'Vue d’ensemble','photoGuideStep1Text':'Prenez une photo large montrant toute la piscine et son environnement.','photoGuideStep2Title':'Gros plan du problème','photoGuideStep2Text':'Rapprochez-vous de la zone concernée pour montrer clairement les détails.','photoGuideStep3Title':'Cadrage final','photoGuideStep3Text':'Cadrez la zone à analyser au centre de l’image, nette et bien éclairée.','photoGuidePrevious':'Précédent','photoGuideNext':'Suivant'},
            'en': {'photoGuideMode':'Guided photo mode','photoGuideStep1Title':'Overview','photoGuideStep1Text':'Take a wide photo showing the whole pool and its surroundings.','photoGuideStep2Title':'Problem close-up','photoGuideStep2Text':'Move closer to the affected area so the details are clearly visible.','photoGuideStep3Title':'Final framing','photoGuideStep3Text':'Center the area to analyze in a sharp, well-lit image.','photoGuidePrevious':'Previous','photoGuideNext':'Next'},
            'es': {'photoGuideMode':'Modo foto guiado','photoGuideStep1Title':'Vista general','photoGuideStep1Text':'Tome una foto amplia que muestre toda la piscina y su entorno.','photoGuideStep2Title':'Primer plano del problema','photoGuideStep2Text':'Acérquese a la zona afectada para mostrar claramente los detalles.','photoGuideStep3Title':'Encuadre final','photoGuideStep3Text':'Centre la zona que se va a analizar en una imagen nítida y bien iluminada.','photoGuidePrevious':'Anterior','photoGuideNext':'Siguiente'},
            'pt': {'photoGuideMode':'Modo de foto guiado','photoGuideStep1Title':'Vista geral','photoGuideStep1Text':'Tire uma foto ampla mostrando toda a piscina e o ambiente ao redor.','photoGuideStep2Title':'Close-up do problema','photoGuideStep2Text':'Aproxime-se da área afetada para mostrar claramente os detalhes.','photoGuideStep3Title':'Enquadramento final','photoGuideStep3Text':'Centralize a área a analisar numa imagem nítida e bem iluminada.','photoGuidePrevious':'Anterior','photoGuideNext':'Seguinte'},
            'de': {'photoGuideMode':'Geführter Fotomodus','photoGuideStep1Title':'Gesamtansicht','photoGuideStep1Text':'Machen Sie ein weites Foto, das den gesamten Pool und seine Umgebung zeigt.','photoGuideStep2Title':'Nahaufnahme des Problems','photoGuideStep2Text':'Gehen Sie näher an den betroffenen Bereich heran, damit die Details klar sichtbar sind.','photoGuideStep3Title':'Endgültiger Bildausschnitt','photoGuideStep3Text':'Zentrieren Sie den zu analysierenden Bereich in einem scharfen, gut beleuchteten Bild.','photoGuidePrevious':'Zurück','photoGuideNext':'Weiter'},
            'it': {'photoGuideMode':'Modalità foto guidata','photoGuideStep1Title':'Vista d’insieme','photoGuideStep1Text':'Scatta una foto ampia che mostri tutta la piscina e l’ambiente circostante.','photoGuideStep2Title':'Primo piano del problema','photoGuideStep2Text':'Avvicinati alla zona interessata per mostrare chiaramente i dettagli.','photoGuideStep3Title':'Inquadratura finale','photoGuideStep3Text':'Centra la zona da analizzare in un’immagine nitida e ben illuminata.','photoGuidePrevious':'Indietro','photoGuideNext':'Avanti'},
            'nl': {'photoGuideMode':'Begeleide fotomodus','photoGuideStep1Title':'Overzicht','photoGuideStep1Text':'Maak een brede foto waarop het hele zwembad en de omgeving zichtbaar zijn.','photoGuideStep2Title':'Close-up van het probleem','photoGuideStep2Text':'Ga dichter naar het probleemgebied zodat de details duidelijk zichtbaar zijn.','photoGuideStep3Title':'Definitieve kadrering','photoGuideStep3Text':'Plaats het te analyseren gebied centraal in een scherpe, goed belichte foto.','photoGuidePrevious':'Vorige','photoGuideNext':'Volgende'},
          }
          for locale, values in translations.items():
              p = root / f'src/i18n/locales/{locale}.json'
              data = json.loads(p.read_text(encoding='utf-8'))
              if 'diagnostic' not in data or not isinstance(data['diagnostic'], dict):
                  raise SystemExit(f'diagnostic namespace missing in {locale}')
              data['diagnostic'].update(values)
              p.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          test = root / 'tests/guided-visuals.test.ts'
          test.write_text('''import { existsSync, readFileSync } from 'node:fs'\nimport { join } from 'node:path'\nimport { describe, expect, it } from 'vitest'\n\nconst ROOT = process.cwd()\nconst stripAssets = [\n  '/guides/stripscan/stripscan-guide-1-prepare.svg',\n  '/guides/stripscan/stripscan-guide-2-lighting.svg',\n  '/guides/stripscan/stripscan-guide-3-align.svg',\n] as const\nconst photoAssets = [\n  '/guides/photo-diagnostic/photo-diagnostic-guide-1-overview.svg',\n  '/guides/photo-diagnostic/photo-diagnostic-guide-2-closeup.svg',\n  '/guides/photo-diagnostic/photo-diagnostic-guide-3-frame.svg',\n] as const\n\ndescribe('AQWELIA guided visual assets', () => {\n  it('ships six language-neutral SVG illustrations without embedded text', () => {\n    for (const asset of [...stripAssets, ...photoAssets]) {\n      const path = join(ROOT, 'public', asset.replace(/^\\//, ''))\n      expect(existsSync(path)).toBe(true)\n      const svg = readFileSync(path, 'utf8')\n      expect(svg).not.toContain('<text')\n      expect(svg).not.toContain('AQWELIA')\n    }\n  })\n\n  it('uses object-contain and overlays the official AQWELIA logo in StripScan', () => {\n    const source = readFileSync(join(ROOT, 'src/components/aquamind/strip-scanner.tsx'), 'utf8')\n    for (const asset of stripAssets) expect(source).toContain(asset)\n    expect(source).toContain('object-contain')\n    expect(source).toContain('/branding/aqwelia-logo-main.png')\n  })\n\n  it('provides a translated 3-step Photo Diagnostic guide', () => {\n    const source = readFileSync(join(ROOT, 'src/components/aquamind/module-diagnostic.tsx'), 'utf8')\n    for (const asset of photoAssets) expect(source).toContain(asset)\n    expect(source).toContain("t('photoGuideStep1Title')")\n    expect(source).toContain("t('photoGuideStep2Title')")\n    expect(source).toContain("t('photoGuideStep3Title')")\n    expect(source).toContain('/branding/aqwelia-logo-main.png')\n  })\n\n  it('defines Photo Diagnostic guide copy in every supported locale', () => {\n    for (const locale of ['fr', 'en', 'es', 'pt', 'de', 'it', 'nl']) {\n      const json = JSON.parse(readFileSync(join(ROOT, `src/i18n/locales/${locale}.json`), 'utf8'))\n      expect(json.diagnostic.photoGuideMode).toBeTruthy()\n      expect(json.diagnostic.photoGuideStep1Title).toBeTruthy()\n      expect(json.diagnostic.photoGuideStep2Title).toBeTruthy()\n      expect(json.diagnostic.photoGuideStep3Title).toBeTruthy()\n    }\n  })\n})\n''', encoding='utf-8')
          PY
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate focused integration
        run: |
          bunx vitest run tests/guided-visuals.test.ts
          bun run typecheck
      - name: Commit one final Round 2 change
        shell: bash
        run: |
          rm .github/workflows/aqwelia-guided-visuals-round2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(guides): polish visuals and add full i18n photo guide"
          git push origin HEAD:feat/aqwelia-guided-visuals
