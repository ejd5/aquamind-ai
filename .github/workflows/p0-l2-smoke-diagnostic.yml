name: P0-L2 smoke diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: file:/tmp/aqwelia-ci.db
      NEXTAUTH_SECRET: test-secret-for-ci-only-do-not-use-in-production
      NEXTAUTH_URL: http://localhost:3099
      AUTH_TRUST_HOST: "true"
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_test_ci_placeholder
      REVENUECAT_WEBHOOK_SECRET: rc_wh_test_ci_only
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"
      - run: bun install --frozen-lockfile >/dev/null
      - run: bun run db:generate:all >/dev/null
      - name: Capture smoke output
        id: smoke
        shell: bash
        run: |
          set +e
          bash tests/run-smoke-tests.sh > /tmp/p0l2-smoke.txt 2>&1
          status=$?
          set -e
          cat /tmp/p0l2-smoke.txt
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Upload smoke diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p0l2-smoke-diagnostic
          path: /tmp/p0l2-smoke.txt
          retention-days: 1
      - name: Fail when smoke failed
        if: steps.smoke.outputs.status != '0'
        run: exit 1
