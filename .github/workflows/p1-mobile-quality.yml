name: P1 Mobile Quality

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/p1-mobile-quality.yml"
      - "capacitor.config.ts"
      - "next.config.mobile.ts"
      - "package.json"
      - "bun.lock"
      - "src/app/**"
      - "src/components/**"
      - "src/lib/api-client.ts"
      - "src/lib/offline/**"
      - "src/mobile-app/**"
      - "tests/p1-mobile-*.test.ts"

permissions:
  contents: read

jobs:
  mobile-build:
    name: Validate Capacitor static export
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: file:/tmp/aqwelia-mobile-ci.db
      NEXTAUTH_SECRET: test-secret-for-mobile-ci-only
      NEXTAUTH_URL: https://mobile-ci.aqwelia.invalid
      AUTH_TRUST_HOST: "true"
      NEXT_PUBLIC_API_BASE_URL: https://mobile-api-ci.aqwelia.invalid
      STRIPE_SECRET_KEY: sk_test_mobile_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_mobile_ci_placeholder
      REVENUECAT_WEBHOOK_SECRET: rc_wh_mobile_ci_only

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma clients
        run: bun run db:generate:all

      - name: Lint repository
        shell: bash
        run: |
          set -o pipefail
          bun run lint 2>&1 | tee /tmp/aqwelia-lint.log

      - name: Upload failed lint log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p1-mobile-lint-log
          path: /tmp/aqwelia-lint.log
          if-no-files-found: error
          retention-days: 7

      - name: Run smoke tests
        shell: bash
        run: |
          set -o pipefail
          bash tests/run-smoke-tests.sh 2>&1 | tee /tmp/aqwelia-smoke-tests.log

      - name: Upload failed smoke-test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p1-mobile-smoke-test-log
          path: /tmp/aqwelia-smoke-tests.log
          if-no-files-found: error
          retention-days: 7

      - name: Build Capacitor static export
        shell: bash
        run: |
          set -o pipefail
          bun run mobile:build 2>&1 | tee /tmp/aqwelia-mobile-build.log

      - name: Upload failed mobile build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: p1-mobile-build-log
          path: /tmp/aqwelia-mobile-build.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Assert mobile output
        run: test -f out/index.html
