name: Apply P0-L consolidated bundle

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - name: Rebuild and verify P0-L bundle
        run: |
          cat \
            .tmp/p0l-bundle-xz.b64.00a \
            .tmp/p0l-bundle-xz.b64.00b \
            .tmp/p0l-bundle-xz.b64.01 \
            .tmp/p0l-bundle-xz.b64.02 \
            .tmp/p0l-bundle-xz.b64.03 \
            .tmp/p0l-bundle-xz.b64.04 \
            .tmp/p0l-bundle-xz.b64.05 \
            | base64 -d > /tmp/p0l-bundle.tar.xz
          test "$(sha256sum /tmp/p0l-bundle.tar.xz | awk '{print $1}')" = "$(cat .tmp/p0l-bundle-xz.sha256)"
          tar -xJf /tmp/p0l-bundle.tar.xz -C .
      - name: Remove temporary delivery files
        run: |
          rm -f .tmp/p0l-bundle-xz.b64.*
          rm -f .tmp/p0l-bundle-xz.sha256
          rm -f .tmp/p0l-bundle.tar.gz
          rm -f .github/workflows/apply-p0l-bundle.yml
          rm -f .github/workflows/export-p0l-worktree.yml
      - name: Commit P0-L baseline
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(p0-l): apply launch security baseline'
          git push origin HEAD:${{ github.head_ref }}
