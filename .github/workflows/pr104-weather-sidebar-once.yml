name: PR104 Weather Sidebar Once

on:
  push:
    branches:
      - fix/pr104-weather-sidebar

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply targeted weather/sidebar fix
        shell: python
        run: |
          from pathlib import Path

          weather = Path('src/components/aquamind/module-weather.tsx')
          s = weather.read_text()

          s = s.replace(
              "  assessment: Assessment\n  lastTestDaysAgo: number\n  error?: string\n",
              "  assessment: Assessment | null\n  lastTestDaysAgo: number\n  upgradeRequired?: boolean\n  error?: string\n",
          )
          s = s.replace(
              "  const t = useTranslations('weather')\n  const locale = useLocale()\n",
              "  const t = useTranslations('weather')\n  const tNav = useTranslations('nav')\n  const locale = useLocale()\n",
          )

          old = """  const { weather, assessment } = data
  const topAlert = assessment.alerts[0]
  const algae = ALGAE_CFG[assessment.algaeRisk]
  const swim = SWIM_CFG[assessment.swimComfort]

  return (
"""
          new = """  const { weather, assessment } = data

  // Basic weather is available to every authenticated user. Advanced pool
  // assessment may legitimately be null when the weather_advanced feature is
  // gated. Never dereference it before this guard: the previous implementation
  // caused a full client-side crash for Freemium users.
  if (!assessment) {
    return (
      <div className=\"space-y-5\">
        <Header
          t={t}
          right={
            <Button
              variant=\"outline\"
              size=\"sm\"
              onClick={() => load(locationInput.trim() ? { location: locationInput.trim() } : undefined)}
              className=\"border-border/60\"
              disabled={loading || locating}
            >
              <RefreshCw className=\"h-3.5 w-3.5\" />
              {t('refresh')}
            </Button>
          }
        />

        <Card className=\"glass-card\">
          <CardHeader className=\"pb-2\">
            <CardDescription>{t('currentConditions')}</CardDescription>
            <CardTitle className=\"flex items-center justify-between font-display text-base\">
              <span>{t('nowAt', { location: weather.location })}</span>
              {codeToIcon(weather.weatherCode)}
            </CardTitle>
          </CardHeader>
          <CardContent>
            <div className=\"flex flex-wrap items-end gap-6\">
              <div>
                <p className=\"font-display text-5xl font-bold text-primary\">{weather.currentTempC}°C</p>
                <p className=\"text-xs text-muted-foreground\">
                  {t('feelsLike')} {weather.feelsLikeC}°C · {t(`codes.${weather.weatherCode}`)}
                </p>
              </div>
              <div className=\"grid grid-cols-2 gap-x-6 gap-y-2 sm:grid-cols-3\">
                <Metric icon={<Droplets className=\"h-3.5 w-3.5 text-primary\" />} label={t('humidity')} value={`${weather.humidity}%`} />
                <Metric icon={<Sun className=\"h-3.5 w-3.5 text-gold\" />} label={t('uvShort')} value={`${weather.uvIndex}`} />
                <Metric icon={<Wind className=\"h-3.5 w-3.5 text-primary\" />} label={t('wind')} value={`${weather.windKmph} km/h`} />
                <Metric icon={<Umbrella className=\"h-3.5 w-3.5 text-primary\" />} label={t('precipShort')} value={`${weather.precipMm} mm`} />
                <Metric icon={<Thermometer className=\"h-3.5 w-3.5 text-gold\" />} label={t('tomorrow')} value={`${weather.tomorrowMinC}–${weather.tomorrowMaxC}°C`} />
                <Metric icon={<CloudRain className=\"h-3.5 w-3.5 text-primary\" />} label={t('rainTomorrow')} value={`${weather.tomorrowChanceRain}%`} />
              </div>
            </div>
          </CardContent>
        </Card>

        <Card className=\"border-gold/40 bg-gold/5\">
          <CardHeader className=\"pb-3\">
            <CardTitle className=\"flex items-center gap-2 font-display text-base\">
              <Sparkles className=\"h-4 w-4 text-gold\" />
              {t('smartWeather')}
              <Badge variant=\"outline\" className=\"ml-1 border-gold/40 text-gold\">{tNav('premium')}</Badge>
            </CardTitle>
            <CardDescription>{t('subtitle')}</CardDescription>
          </CardHeader>
          {onNavigate && (
            <CardContent className=\"pt-0\">
              <Button
                onClick={() => onNavigate('paywall')}
                className=\"bg-gradient-to-r from-primary to-gold text-primary-foreground\"
              >
                <Crown className=\"h-4 w-4\" />
                {tNav('premium')}
              </Button>
            </CardContent>
          )}
        </Card>

        <Card className=\"glass-card\">
          <CardHeader className=\"pb-2\">
            <CardTitle className=\"font-display text-base\">{t('forecast3days')}</CardTitle>
          </CardHeader>
          <CardContent>
            <div className=\"grid grid-cols-3 gap-2\">
              {weather.next3days.map((d, i) => (
                <div key={i} className=\"flex flex-col items-center gap-1 rounded-xl border border-border/50 bg-background/40 p-3 text-center\">
                  <span className=\"text-[10px] font-semibold uppercase tracking-wide text-muted-foreground\">
                    {i === 0 ? t('today') : i === 1 ? t('tomorrow') : new Date(d.date).toLocaleDateString(locale, { weekday: 'short' })}
                  </span>
                  <span className=\"text-2xl\">{codeToIcon(d.code)}</span>
                  <span className=\"font-display text-lg font-bold text-primary\">{d.maxC}°C</span>
                  <span className=\"flex items-center gap-0.5 text-[10px] text-muted-foreground\">
                    <CloudRain className=\"h-3 w-3\" />
                    {d.chanceRain}%
                  </span>
                </div>
              ))}
            </div>
          </CardContent>
        </Card>
      </div>
    )
  }

  const topAlert = assessment.alerts[0]
  const algae = ALGAE_CFG[assessment.algaeRisk]
  const swim = SWIM_CFG[assessment.swimComfort]

  return (
"""
          if old not in s:
              raise SystemExit('weather anchor not found')
          s = s.replace(old, new, 1)
          s = s.replace(
              "  Loader2,\n} from 'lucide-react'",
              "  Loader2,\n  Crown,\n} from 'lucide-react'",
              1,
          )
          weather.write_text(s)

          shell = Path('src/components/aquamind/app-shell.tsx')
          s = shell.read_text()
          old_aside = 'className="custom-scroll sticky top-32 hidden h-[calc(100vh-8rem)] w-56 shrink-0 overflow-y-auto border-r border-border/40 py-6 pr-4 md:block"'
          new_aside = 'className="custom-scroll sticky top-32 hidden h-[calc(100vh-8rem)] w-72 shrink-0 overflow-y-auto border-r border-border/40 py-6 pr-5 md:block"'
          if old_aside not in s:
              raise SystemExit('sidebar width anchor not found')
          s = s.replace(old_aside, new_aside, 1)
          old_label = '<span className="truncate">{item.label}</span>'
          new_label = '<span className="min-w-0 flex-1 whitespace-normal text-left leading-tight">{item.label}</span>'
          if old_label not in s:
              raise SystemExit('sidebar label anchor not found')
          s = s.replace(old_label, new_label, 1)
          shell.write_text(s)

          test = Path('tests/weather-sidebar-regression.test.ts')
          test.write_text("""import { describe, expect, test } from 'bun:test'\nimport { readFileSync } from 'node:fs'\n\nconst weather = readFileSync('src/components/aquamind/module-weather.tsx', 'utf8')\nconst shell = readFileSync('src/components/aquamind/app-shell.tsx', 'utf8')\n\ndescribe('weather + sidebar production regression', () => {\n  test('weather_advanced gate cannot crash basic weather', () => {\n    expect(weather).toContain('assessment: Assessment | null')\n    expect(weather).toContain('if (!assessment)')\n    expect(weather.indexOf('if (!assessment)')).toBeLessThan(weather.indexOf('assessment.alerts[0]'))\n    expect(weather).toContain(\"onNavigate('paywall')\")\n  })\n\n  test('desktop sidebar displays complete labels', () => {\n    expect(shell).toContain('w-72 shrink-0')\n    expect(shell).toContain('whitespace-normal text-left leading-tight')\n    expect(shell).not.toContain('<span className=\"truncate\">{item.label}</span>')\n  })\n})\n""")

          Path('.github/workflows/pr104-weather-sidebar-once.yml').unlink()

      - name: Commit final patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(weather): prevent gated crash and widen desktop sidebar"
          git push origin HEAD:fix/pr104-weather-sidebar
