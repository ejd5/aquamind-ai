name: Billing webhook retries

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retry due Stripe and RevenueCat events
        env:
          BILLING_RETRY_CRON_SECRET: ${{ secrets.BILLING_RETRY_CRON_SECRET }}
        run: |
          if [ -z "$BILLING_RETRY_CRON_SECRET" ]; then
            echo '::notice::BILLING_RETRY_CRON_SECRET is not configured; retry worker skipped.'
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $BILLING_RETRY_CRON_SECRET" \
            -H "Content-Type: application/json" \
            https://aqwelia-production.vercel.app/api/cron/billing-retries
