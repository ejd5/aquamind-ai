name: Finalize P1-C GPS device i18n

on:
  push:
    branches:
      - feat/pro-gps-device-connector
    paths:
      - scripts/finalize-p1c-gps-i18n.py
      - .github/workflows/finalize-p1c-gps-i18n.yml

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message || '', '[skip gps-i18n-finalize]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/pro-gps-device-connector
          fetch-depth: 1
      - run: python3 scripts/finalize-p1c-gps-i18n.py
      - name: Remove one-time finalizer
        run: |
          rm -f scripts/finalize-p1c-gps-i18n.py
          rm -f .github/workflows/finalize-p1c-gps-i18n.yml
      - name: Commit canonical locale integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'i18n(p1-c): use canonical GPS device locale copy [skip gps-i18n-finalize]'
          git push origin HEAD:feat/pro-gps-device-connector
