name: Apply P1 Scientific Persistence

on:
  push:
    branches:
      - feat/p1-scientific-persistence
    paths:
      - '.github/workflows/p1-scientific-persistence-apply.yml'

permissions:
  contents: write

concurrency:
  group: p1-scientific-persistence-apply
  cancel-in-progress: false

jobs:
  apply:
    name: Patch schemas and migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/p1-scientific-persistence
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Patch canonical schema and create migrations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          schema_path = Path('prisma/schema.prisma')
          text = schema_path.read_text()

          def replace_once(source: str, old: str, new: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one schema match, got {count}: {old!r}')
              return source.replace(old, new, 1)

          text = replace_once(
              text,
              '  saltSystem    Boolean  @default(false)\n  region        String? // région / climat',
              '  saltSystem              Boolean  @default(false)\n'
              '  manufacturerSaltMin      Float? // g/L — minimum documenté par l’équipement\n'
              '  manufacturerSaltMax      Float? // g/L — maximum documenté par l’équipement\n'
              '  manufacturerChlorineMax  Float? // mg/L — limite haute de la notice produit\n'
              '  region                  String? // région / climat',
          )

          text = replace_once(
              text,
              '  temperature      Float? // °C\n  source           String   @default("manual") // manual | strip_photo | device | imported',
              '  temperature             Float? // °C\n'
              '  totalDissolvedSolids     Float? // TDS mg/L\n'
              '  measuredAt               DateTime? // instant réel de la mesure\n'
              '  measurementMethod        String? // kit_drop | strip | photometer | probe | device | imported\n'
              '  measurementMetadata      String? // JSON : précision, appareil, calibration, unités\n'
              '  scientificQualityScore   Float? // 0..1, qualité des données — pas une probabilité\n'
              '  scientificMethodVersion  String?\n'
              '  scientificLimitations    String? // JSON string array\n'
              '  lsiMethodVersion         String?\n'
              '  source                  String   @default("manual") // manual | strip_photo | device | imported',
          )

          text = replace_once(
              text,
              '  confidence             Float    @default(0.8)\n  immediateActions       String // JSON string array (ordonnées)',
              '  confidence               Float    @default(0.8)\n'
              '  scientificMethodVersion String?\n'
              '  dosageMethodVersion     String?\n'
              '  swimSafetyMethodVersion String?\n'
              '  immediateActions         String // JSON string array (ordonnées)',
          )

          schema_path.write_text(text)

          migration = '20260726170000_scientific_measurement_persistence'
          sqlite_dir = Path('prisma/migrations') / migration
          postgres_dir = Path('prisma/postgresql/migrations') / migration
          sqlite_dir.mkdir(parents=True, exist_ok=False)
          postgres_dir.mkdir(parents=True, exist_ok=False)

          sqlite_dir.joinpath('migration.sql').write_text('''-- P1 Scientific Quality — persist measurement provenance and manufacturer limits.\nALTER TABLE "PoolProfile" ADD COLUMN "manufacturerSaltMin" REAL;\nALTER TABLE "PoolProfile" ADD COLUMN "manufacturerSaltMax" REAL;\nALTER TABLE "PoolProfile" ADD COLUMN "manufacturerChlorineMax" REAL;\n\nALTER TABLE "WaterTest" ADD COLUMN "totalDissolvedSolids" REAL;\nALTER TABLE "WaterTest" ADD COLUMN "measuredAt" DATETIME;\nALTER TABLE "WaterTest" ADD COLUMN "measurementMethod" TEXT;\nALTER TABLE "WaterTest" ADD COLUMN "measurementMetadata" TEXT;\nALTER TABLE "WaterTest" ADD COLUMN "scientificQualityScore" REAL;\nALTER TABLE "WaterTest" ADD COLUMN "scientificMethodVersion" TEXT;\nALTER TABLE "WaterTest" ADD COLUMN "scientificLimitations" TEXT;\nALTER TABLE "WaterTest" ADD COLUMN "lsiMethodVersion" TEXT;\n\nALTER TABLE "ActionPlan" ADD COLUMN "scientificMethodVersion" TEXT;\nALTER TABLE "ActionPlan" ADD COLUMN "dosageMethodVersion" TEXT;\nALTER TABLE "ActionPlan" ADD COLUMN "swimSafetyMethodVersion" TEXT;\n''')

          postgres_dir.joinpath('migration.sql').write_text('''-- P1 Scientific Quality — persist measurement provenance and manufacturer limits.\nALTER TABLE "PoolProfile" ADD COLUMN "manufacturerSaltMin" DOUBLE PRECISION;\nALTER TABLE "PoolProfile" ADD COLUMN "manufacturerSaltMax" DOUBLE PRECISION;\nALTER TABLE "PoolProfile" ADD COLUMN "manufacturerChlorineMax" DOUBLE PRECISION;\n\nALTER TABLE "WaterTest" ADD COLUMN "totalDissolvedSolids" DOUBLE PRECISION;\nALTER TABLE "WaterTest" ADD COLUMN "measuredAt" TIMESTAMP(3);\nALTER TABLE "WaterTest" ADD COLUMN "measurementMethod" TEXT;\nALTER TABLE "WaterTest" ADD COLUMN "measurementMetadata" TEXT;\nALTER TABLE "WaterTest" ADD COLUMN "scientificQualityScore" DOUBLE PRECISION;\nALTER TABLE "WaterTest" ADD COLUMN "scientificMethodVersion" TEXT;\nALTER TABLE "WaterTest" ADD COLUMN "scientificLimitations" TEXT;\nALTER TABLE "WaterTest" ADD COLUMN "lsiMethodVersion" TEXT;\n\nALTER TABLE "ActionPlan" ADD COLUMN "scientificMethodVersion" TEXT;\nALTER TABLE "ActionPlan" ADD COLUMN "dosageMethodVersion" TEXT;\nALTER TABLE "ActionPlan" ADD COLUMN "swimSafetyMethodVersion" TEXT;\n''')
          PY

      - name: Synchronize PostgreSQL schema
        run: bun run db:pg:sync

      - name: Validate generated clients and PostgreSQL structure
        run: |
          bun run db:generate:all
          bun run test:postgresql
          bun run typecheck

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm .github/workflows/p1-scientific-persistence-apply.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add prisma/schema.prisma prisma/postgresql/schema.prisma prisma/migrations prisma/postgresql/migrations .github/workflows/p1-scientific-persistence-apply.yml
          git commit -m 'feat(p1-scientific): persist measurement provenance'
          git push origin HEAD:feat/p1-scientific-persistence
