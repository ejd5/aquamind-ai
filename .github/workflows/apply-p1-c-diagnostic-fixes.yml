name: Apply P1-C diagnostic fixes

on:
  push:
    branches:
      - feat/pro-live-dispatch-foundation
    paths:
      - P1C_APPLY_DIAG_FIXES.md

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pro-live-dispatch-foundation
          fetch-depth: 0
      - name: Patch historical migration test and privacy wording
        run: |
          python - <<'PY'
          from pathlib import Path

          test = Path('tests/test-consent-migration.mjs')
          source = test.read_text()
          old = """      const owner = await c.user.create({ data: { email: `owner-${db}@test.com`, name: 'Owner', role: 'admin', passwordHash: 'test' } })
                const org = await c.organization.create({ data: { name: `OB-${db}`, type: 'growth', ownerId: owner.id } })
                await c.$executeRawUnsafe(
          """
          # Preserve the file's actual six-space indentation.
          old = old.replace('            const org', '      const org').replace('            await c', '      await c')
          new = """      const owner = await c.user.create({ data: { email: `owner-${db}@test.com`, name: 'Owner', role: 'admin', passwordHash: 'test' } })
                const organizationId = `org-${randomUUID()}`
                await c.$executeRawUnsafe(
                  `INSERT INTO \"Organization\" (\"id\", \"type\", \"name\", \"ownerId\", \"updatedAt\")
                   VALUES ('${organizationId}', 'growth', 'OB-${db}', '${owner.id}', NOW())`
                )
                const org = { id: organizationId }
                await c.$executeRawUnsafe(
          """
          new = new.replace('            const organizationId', '      const organizationId').replace('            await c', '      await c').replace('              `INSERT', '        `INSERT').replace('               VALUES', '         VALUES').replace('            )', '      )').replace('            const org', '      const org')
          if old not in source:
              raise SystemExit('historical organization fixture marker not found')
          test.write_text(source.replace(old, new, 1))

          privacy = Path('docs/pro/DISPATCH_LIVE_PRIVACY.md')
          text = privacy.read_text()
          if "l'application est ouverte" not in text:
              raise SystemExit('privacy wording marker not found')
          privacy.write_text(text.replace("l'application est ouverte", 'l’application est ouverte', 1))
          PY
      - name: Remove diagnostic helpers and reports
        run: |
          rm -f P1C_APPLY_DIAG_FIXES.md
          rm -f .github/workflows/apply-p1-c-diagnostic-fixes.yml
          rm -f P1C_POSTGRES_DIAGNOSTIC.txt
          rm -f docs/pro/P1C_POSTGRES_DIAGNOSTIC.md
          rm -f docs/pro/P1C_FINAL_DIAGNOSTIC.md
      - name: Commit corrected branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(p1-c): preserve historical migration coverage'
          git pull --rebase origin feat/pro-live-dispatch-foundation
          git push origin HEAD:feat/pro-live-dispatch-foundation
