name: Deploy P0-L2 analytics consent migration

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-p0-l2-consent-migration.yml

permissions:
  contents: write
  statuses: write

concurrency:
  group: aqwelia-production-p0-l2-consent
  cancel-in-progress: false

jobs:
  migrate:
    name: Deploy and verify privacy consent migration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}
    steps:
      - name: Publish pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"pending\",\"context\":\"AQWELIA P0-L2 production migration\",\"description\":\"Déploiement du consentement analytics dans Neon\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'

      - run: bun install --frozen-lockfile

      - name: Validate direct production connection
        run: |
          node - <<'NODE'
          const value = process.env.DATABASE_URL || ''
          if (!/^postgres(ql)?:\/\//.test(value)) throw new Error('PRODUCTION_DIRECT_URL is required')
          const hostname = new URL(value).hostname
          if (hostname.includes('-pooler')) throw new Error('Direct Neon connection required')
          NODE

      - name: Generate PostgreSQL client
        run: bun run db:pg:generate

      - name: Deploy pending PostgreSQL migrations
        run: bunx prisma migrate deploy --schema prisma/postgresql/schema.prisma

      - name: Verify production privacy state
        run: |
          node - <<'NODE'
          const { PrismaClient } = require('./generated/client-postgresql')
          const db = new PrismaClient()
          ;(async () => {
            const column = await db.$queryRawUnsafe(`
              SELECT column_default, is_nullable
              FROM information_schema.columns
              WHERE table_schema = 'public'
                AND table_name = 'User'
                AND column_name = 'consentAnalytics'
              LIMIT 1
            `)
            if (!column[0]) throw new Error('User.consentAnalytics is missing')
            const defaultValue = String(column[0].column_default || '').toLowerCase()
            if (!defaultValue.includes('false')) {
              throw new Error(`Unexpected consentAnalytics default: ${column[0].column_default}`)
            }

            const enabled = await db.$queryRawUnsafe(`
              SELECT COUNT(*)::int AS count
              FROM "User"
              WHERE "consentAnalytics" = true
            `)
            if (Number(enabled[0]?.count || 0) !== 0) {
              throw new Error(`${enabled[0].count} users still have analytics consent enabled`)
            }

            const migration = await db.$queryRawUnsafe(`
              SELECT migration_name, finished_at, rolled_back_at
              FROM "_prisma_migrations"
              WHERE migration_name = '20260726090000_p0_l2_analytics_consent_default'
              ORDER BY started_at DESC
              LIMIT 1
            `)
            if (!migration[0]?.finished_at || migration[0]?.rolled_back_at) {
              throw new Error('P0-L2 production migration is not marked successful')
            }

            console.log('P0-L2 consent migration verified: default=false, enabled users=0')
          })().finally(() => db.$disconnect())
          NODE

      - name: Publish successful status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -d "{\"state\":\"success\",\"context\":\"AQWELIA P0-L2 production migration\",\"description\":\"Consentement analytics déployé et vérifié dans Neon\",\"target_url\":\"${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"

      - name: Remove one-time workflow after success
        run: |
          rm .github/workflows/deploy-p0-l2-consent-migration.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(p0-l2): remove one-time production migration workflow'
          git push origin HEAD:main
