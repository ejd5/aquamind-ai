name: Diagnose P1-C final failures

on:
  push:
    branches:
      - feat/pro-live-dispatch-foundation
    paths:
      - P1C_FINAL_DIAG_TRIGGER.md

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aqwelia_ci
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: aqwelia_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aqwelia_ci -d aqwelia_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_DATABASE_URL: postgresql://aqwelia_ci:ci-only-password@127.0.0.1:5432/aqwelia_ci
      DATABASE_URL: file:/tmp/aqwelia-ci.db
      NEXTAUTH_SECRET: test-secret-for-ci-only-do-not-use-in-production
      NEXTAUTH_URL: http://localhost:3099
      AUTH_TRUST_HOST: true
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_test_ci_placeholder
      REVENUECAT_WEBHOOK_SECRET: rc_wh_test_ci_only
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/pro-live-dispatch-foundation
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.4'
      - run: bun install --frozen-lockfile
      - run: |
          bun run db:generate
          bun run db:pg:generate
          printf '# P1-C diagnostic\n\n## PostgreSQL migration\n\n```text\n' > docs/pro/P1C_FINAL_DIAGNOSTIC.md
          node tests/test-consent-migration.mjs >> docs/pro/P1C_FINAL_DIAGNOSTIC.md 2>&1 || true
          printf '\n```\n\n## Vitest\n\n```text\n' >> docs/pro/P1C_FINAL_DIAGNOSTIC.md
          bun test >> docs/pro/P1C_FINAL_DIAGNOSTIC.md 2>&1 || true
          printf '\n```\n' >> docs/pro/P1C_FINAL_DIAGNOSTIC.md
      - name: Commit diagnostic output safely
        run: |
          rm -f P1C_FINAL_DIAG_TRIGGER.md
          rm -f .github/workflows/diagnose-p1-c-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f docs/pro/P1C_FINAL_DIAGNOSTIC.md
          git add -A
          git commit -m 'chore(p1-c): capture final diagnostics [skip ci]'
          git pull --rebase origin feat/pro-live-dispatch-foundation
          git push origin HEAD:feat/pro-live-dispatch-foundation
